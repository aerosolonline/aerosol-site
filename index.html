<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>AEROSOL</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{

  width:100%;
  height:100%;

  overflow:hidden;

  background:black;

  font-family:Arial, sans-serif;

}

/* BACKGROUND */

.background{

  position:fixed;

  top:0;
  left:0;

  width:100%;
  height:100%;

  object-fit:cover;

  object-position:center;

  opacity:.9;

  z-index:1;

}

/* DARK VHS OVERLAY */

.overlay{

  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.18);

  z-index:2;

  pointer-events:none;

}

/* LOGO */

.logo{

  position:absolute;

  top:20px;
  left:20px;

  width:300px;

  z-index:20;

}

/* CENTERED LAMB GROUP */

.lamb-container{

  position:absolute;

  top:50%;
  left:50%;

  width:700px;
  height:320px;

  transform:
    translate(-50%,-50%);

  z-index:10;

}

/* LAMBS */

.lamb{

  position:absolute;

  width:180px;

  cursor:pointer;

  transition:
    transform .3s ease,
    filter .3s ease;

  filter:
    drop-shadow(0 0 10px rgba(255,255,255,.85));

}

.lamb:hover{

  transform:
    scale(1.08)
    rotate(-2deg);

  filter:
    drop-shadow(0 0 18px rgba(255,255,255,1));

}

/* POSITIONS */

.ig{
  left:0;
  top:40px;
}

.shop{
  left:220px;
  top:120px;
}

.yt{
  left:430px;
  top:10px;
}

/* AUDIO PLAYER */

.player{

  position:absolute;

  bottom:36px;
  left:50%;

  transform:
    translateX(-50%);

  display:flex;
  align-items:center;

  gap:10px;

  z-index:30;

}

/* PLAY BUTTON */

#playBtn{

  background:none;

  border:none;

  color:#ef8ee7;

  font-size:18px;

  cursor:pointer;

  line-height:1;

}

/* BAR CONTAINER */

.progress-container{

  width:95px;
  height:3px;

  background:
    rgba(239,142,231,.25);

  position:relative;

  overflow:hidden;

}

/* FILLED BAR */

.progress-fill{

  position:absolute;

  top:0;
  left:0;

  height:100%;

  width:0%;

  background:#ef8ee7;

}

/* INVISIBLE INPUT */

#progress{

  position:absolute;

  width:95px;
  height:12px;

  opacity:0;

  cursor:pointer;

}

/* MOBILE */

@media (max-width:768px){

  .logo{
    width:220px;
  }

  .lamb-container{
    width:320px;
    height:420px;
  }

  .lamb{
    width:140px;
  }

  .ig{
    left:0;
    top:20px;
  }

  .shop{
    left:90px;
    top:140px;
  }

  .yt{
    left:170px;
    top:40px;
  }

}

</style>

</head>

<body>

<!-- BACKGROUND -->

<img
  src="bg.jpg"
  class="background"
/>

<!-- OVERLAY -->

<div class="overlay"></div>

<!-- LOGO -->

<img
  src="logo.png"
  class="logo"
/>

<!-- LAMBS -->

<div class="lamb-container">

  <!-- INSTAGRAM -->

  <a
    href="https://instagram.com/aerosol_____"
    target="_blank"
  >

    <img
      src="lamb1.png"
      class="lamb ig"
    />

  </a>

  <!-- SHOP -->

  <a
    href="https://aerosolskateboards.com"
    target="_blank"
  >

    <img
      src="lamb2.png"
      class="lamb shop"
    />

  </a>

  <!-- YOUTUBE -->

  <a
    href="https://www.youtube.com/@a.e.r.o.s.o.l"
    target="_blank"
  >

    <img
      src="lamb3.png"
      class="lamb yt"
    />

  </a>

</div>

<!-- AUDIO -->

<div class="player">

  <button id="playBtn">
    ▶
  </button>

  <div class="progress-container">

    <div
      class="progress-fill"
      id="progressFill"
    ></div>

    <input
      type="range"
      id="progress"
      value="0"
      min="0"
      max="100"
    />

  </div>

</div>

<!-- AUDIO FILE -->

<audio id="audio">

  <source
    src="song.mp3"
    type="audio/mpeg"
  />

</audio>

<!-- SCRIPT -->

<script>

const audio =
  document.getElementById("audio");

const playBtn =
  document.getElementById("playBtn");

const progress =
  document.getElementById("progress");

const progressFill =
  document.getElementById("progressFill");

/* PLAY / PAUSE */

playBtn.addEventListener("click",()=>{

  if(audio.paused){

    audio.play();

    playBtn.innerText = "❚❚";

  }else{

    audio.pause();

    playBtn.innerText = "▶";

  }

});

/* UPDATE BAR */

audio.addEventListener("timeupdate",()=>{

  const percent =
    (audio.currentTime / audio.duration) * 100;

  progress.value = percent;

  progressFill.style.width =
    percent + "%";

});

/* SCRUB */

progress.addEventListener("input",()=>{

  const scrub =
    (progress.value / 100) * audio.duration;

  audio.currentTime = scrub;

  progressFill.style.width =
    progress.value + "%";

});

</script>

</body>

</html>
