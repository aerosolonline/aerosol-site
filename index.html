<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<title>AEROSOL</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{

  width:100%;
  min-height:100svh;

  overflow-x:hidden;
  overflow-y:hidden;

  background:black;

  font-family:Arial, sans-serif;

}

/* BACKGROUND */

.background{

  position:fixed;

  top:0;
  left:0;

  width:100%;
  height:100%;

  object-fit:cover;

  object-position:center center;

  opacity:.92;

  z-index:-2;

}

/* OVERLAY */

.overlay{

  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.08);

  pointer-events:none;

  z-index:-1;

}

/* LOGO */

.logo{

  position:absolute;

  top:14px;
  left:12px;

  width:clamp(150px,18vw,280px);

  z-index:20;

}

/* LAMB AREA */

.lamb-wrapper{

  position:absolute;

  left:50%;
  top:55%;

  transform:
    translate(-50%,-50%);

  width:min(1200px,92vw);

  aspect-ratio:16/8;

  z-index:15;

}

/* LAMBS */

.lamb{

  position:absolute;

  cursor:pointer;

  transition:
    transform .25s ease,
    filter .25s ease;

  filter:
    drop-shadow(0 0 3px rgba(255,255,255,.18));

}

.lamb:hover{

  transform:
    scale(1.03)
    rotate(-2deg);

  filter:
    drop-shadow(0 0 7px rgba(255,255,255,.35));

}

/* DESKTOP */

.ig{

  width:28%;

  left:4%;
  top:6%;

}

.shop{

  width:31%;

  left:35%;
  top:42%;

}

.yt{

  width:29%;

  left:69%;
  top:8%;

}

/* PLAYER */

.player{

  position:absolute;

  left:50%;
  bottom:28px;

  transform:
    translateX(-50%);

  display:flex;
  align-items:center;

  gap:10px;

  z-index:30;

}

/* PLAY BUTTON */

#playBtn{

  background:none;

  border:none;

  color:#ef8ee7;

  font-size:18px;

  cursor:pointer;

  line-height:1;

}

/* BAR */

.progress-container{

  position:relative;

  width:96px;
  height:4px;

  background:#9f4f9c;

  border:
    1px solid #9f4f9c;

}

/* FILL */

.progress-fill{

  position:absolute;

  top:0;
  left:0;

  width:0%;
  height:100%;

  background:#ef8ee7;

}

/* RANGE */

#progress{

  position:absolute;

  inset:0;

  width:100%;

  opacity:0;

  cursor:pointer;

}

/* MOBILE */

@media (max-width:700px){

  .logo{

    width:130px;

  }

  .lamb-wrapper{

    width:100vw;

    height:60vh;

    top:52%;

  }

  .ig{

    width:38%;

    left:-2%;
    top:10%;

  }

  .shop{

    width:42%;

    left:29%;
    top:44%;

  }

  .yt{

    width:39%;

    left:66%;
    top:12%;

  }

  .player{

    bottom:22px;

  }

}

</style>

</head>

<body>

<!-- BACKGROUND -->

<img
  src="bg.jpg"
  class="background"
>

<!-- OVERLAY -->

<div class="overlay"></div>

<!-- LOGO -->

<img
  src="logo.png"
  class="logo"
>

<!-- LAMBS -->

<div class="lamb-wrapper">

  <!-- INSTAGRAM -->

  <a
    href="https://instagram.com/aerosol_____"
    target="_blank"
  >

    <img
      src="lamb1.png"
      class="lamb ig"
    >

  </a>

  <!-- SHOP -->

  <a
    href="https://aerosolskateboards.com"
    target="_blank"
  >

    <img
      src="lamb2.png"
      class="lamb shop"
    >

  </a>

  <!-- YOUTUBE -->

  <a
    href="https://www.youtube.com/@a.e.r.o.s.o.l"
    target="_blank"
  >

    <img
      src="lamb3.png"
      class="lamb yt"
    >

  </a>

</div>

<!-- PLAYER -->

<div class="player">

  <button id="playBtn">
    ▶
  </button>

  <div class="progress-container">

    <div
      class="progress-fill"
      id="progressFill"
    ></div>

    <input
      type="range"
      id="progress"
      min="0"
      max="100"
      value="0"
    >

  </div>

</div>

<!-- AUDIO -->

<audio id="audio">

  <source
    src="song.mp3"
    type="audio/mpeg"
  >

</audio>

<script>

const audio =
  document.getElementById("audio");

const playBtn =
  document.getElementById("playBtn");

const progress =
  document.getElementById("progress");

const progressFill =
  document.getElementById("progressFill");

/* PLAY / PAUSE */

playBtn.addEventListener("click",()=>{

  if(audio.paused){

    audio.play();

    playBtn.innerText = "❚❚";

  }else{

    audio.pause();

    playBtn.innerText = "▶";

  }

});

/* UPDATE BAR */

audio.addEventListener("timeupdate",()=>{

  const percent =
    (audio.currentTime / audio.duration) * 100;

  progress.value = percent;

  progressFill.style.width =
    percent + "%";

});

/* SCRUB */

progress.addEventListener("input",()=>{

  audio.currentTime =
    (progress.value / 100) * audio.duration;

  progressFill.style.width =
    progress.value + "%";

});

</script>

</body>

</html>
