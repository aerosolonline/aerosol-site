<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>AEROSOL</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{

  width:100%;
  height:100%;

  overflow:hidden;

  background:black;

  font-family:Arial, sans-serif;

}

/* BACKGROUND */

.background{

  position:fixed;

  top:0;
  left:0;

  width:100vw;
  height:100vh;

  object-fit:cover;

  object-position:center;

  opacity:.92;

}

/* OVERLAY */

.overlay{

  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.08);

  pointer-events:none;

}

/* LOGO */

.logo{

  position:absolute;

  top:16px;
  left:14px;

  width:280px;

  z-index:20;

}

/* LAMB WRAPPER */

.lamb-wrapper{

  position:absolute;

  left:50%;
  top:58%;

  transform:
    translate(-50%,-50%);

  width:700px;
  height:260px;

  z-index:15;

}

/* SCALE WHOLE COMPOSITION */

.lamb-scale{

  position:relative;

  width:700px;
  height:260px;

  transform-origin:center;

}

/* LAMBS */

.lamb{

  position:absolute;

  cursor:pointer;

  transition:
    transform .25s ease,
    filter .25s ease;

  filter:
    drop-shadow(0 0 3px rgba(255,255,255,.28));

}

.lamb:hover{

  transform:
    scale(1.04)
    rotate(-2deg);

  filter:
    drop-shadow(0 0 7px rgba(255,255,255,.5));

}

/* EXACT REFERENCE POSITIONS */

.ig{

  width:165px;

  left:120px;
  top:0px;

}

.shop{

  width:185px;

  left:280px;
  top:82px;

}

.yt{

  width:170px;

  left:470px;
  top:10px;

}

/* PLAYER */

.player{

  position:absolute;

  left:50%;
  bottom:36px;

  transform:
    translateX(-50%);

  display:flex;
  align-items:center;

  gap:10px;

  z-index:30;

}

/* PLAY BUTTON */

#playBtn{

  background:none;

  border:none;

  color:#ef8ee7;

  font-size:18px;

  cursor:pointer;

  line-height:1;

}

/* BAR */

.progress-container{

  position:relative;

  width:96px;
  height:4px;

  background:#9f4f9c;

  border:
    1px solid #9f4f9c;

}

/* FILL */

.progress-fill{

  position:absolute;

  top:0;
  left:0;

  width:0%;
  height:100%;

  background:#ef8ee7;

}

/* INPUT */

#progress{

  position:absolute;

  top:-5px;
  left:0;

  width:96px;
  height:14px;

  opacity:0;

  cursor:pointer;

}

/* RESPONSIVE SCALE */

@media (max-width:900px){

  .lamb-scale{

    transform:
      scale(.82);

  }

}

@media (max-width:700px){

  .logo{

    width:180px;

  }

  .lamb-wrapper{

    top:56%;

  }

  .lamb-scale{

    transform:
      scale(.58);

  }

}

</style>

</head>

<body>

<!-- BACKGROUND -->

<img
  src="bg.jpg"
  class="background"
>

<!-- OVERLAY -->

<div class="overlay"></div>

<!-- LOGO -->

<img
  src="logo.png"
  class="logo"
>

<!-- LAMBS -->

<div class="lamb-wrapper">

  <div class="lamb-scale">

    <!-- IG -->

    <a
      href="https://instagram.com/aerosol_____"
      target="_blank"
    >

      <img
        src="lamb1.png"
        class="lamb ig"
      >

    </a>

    <!-- SHOP -->

    <a
      href="https://aerosolskateboards.com"
      target="_blank"
    >

      <img
        src="lamb2.png"
        class="lamb shop"
      >

    </a>

    <!-- YOUTUBE -->

    <a
      href="https://www.youtube.com/@a.e.r.o.s.o.l"
      target="_blank"
    >

      <img
        src="lamb3.png"
        class="lamb yt"
      >

    </a>

  </div>

</div>

<!-- PLAYER -->

<div class="player">

  <button id="playBtn">
    ▶
  </button>

  <div class="progress-container">

    <div
      class="progress-fill"
      id="progressFill"
    ></div>

    <input
      type="range"
      id="progress"
      min="0"
      max="100"
      value="0"
    >

  </div>

</div>

<!-- AUDIO -->

<audio id="audio">

  <source
    src="song.mp3"
    type="audio/mpeg"
  >

</audio>

<!-- SCRIPT -->

<script>

const audio =
  document.getElementById("audio");

const playBtn =
  document.getElementById("playBtn");

const progress =
  document.getElementById("progress");

const progressFill =
  document.getElementById("progressFill");

/* PLAY */

playBtn.addEventListener("click",()=>{

  if(audio.paused){

    audio.play();

    playBtn.innerText = "❚❚";

  }else{

    audio.pause();

    playBtn.innerText = "▶";

  }

});

/* UPDATE BAR */

audio.addEventListener("timeupdate",()=>{

  const percent =
    (audio.currentTime / audio.duration) * 100;

  progress.value = percent;

  progressFill.style.width =
    percent + "%";

});

/* SCRUB */

progress.addEventListener("input",()=>{

  const scrub =
    (progress.value / 100) * audio.duration;

  audio.currentTime = scrub;

  progressFill.style.width =
    progress.value + "%";

});

</script>

</body>

</html>
