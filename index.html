<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AEROSOL</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow:hidden;
      background:black;
      font-family:Arial, sans-serif;
      width:100vw;
      height:100vh;
    }

    /* BACKGROUND */

    .background{
      position:fixed;

      inset:0;

      width:100vw;
      height:100vh;

      object-fit:cover;

      z-index:-1;

      filter:
        blur(2px)
        brightness(70%)
        saturate(80%);
    }

    /* LOGO */

    .logo{
      position:absolute;

      top:20px;
      left:20px;

      width:300px;

      z-index:10;
    }

    /* CENTERED LAMB AREA */

    .lamb-container{
      position:absolute;

      top:50%;
      left:50%;

      width:700px;
      height:320px;

      transform:translate(-50%,-50%);
    }

    /* LAMBS */

    .lamb{
      position:absolute;

      width:180px;

      cursor:pointer;

      transition:
        transform .3s ease,
        filter .3s ease;

      filter:
        drop-shadow(0 0 10px rgba(255,255,255,0.8));
    }

    .lamb:hover{
      transform:
        scale(1.08)
        rotate(-2deg);

      filter:
        drop-shadow(0 0 18px rgba(255,255,255,1));
    }

    /* INDIVIDUAL POSITIONS */

    .ig{
      left:0;
      top:40px;
    }

    .shop{
      left:220px;
      top:120px;
    }

    .yt{
      left:430px;
      top:10px;
    }

    /* AUDIO PLAYER */

    .player{
      position:absolute;

      bottom:35px;
      left:50%;

      transform:translateX(-50%);

      display:flex;
      flex-direction:column;
      align-items:center;

      gap:10px;

      z-index:20;
    }

    button{
      background:#ff8de1;

      color:white;

      border:none;

      padding:10px 22px;

      cursor:pointer;

      font-size:14px;

      letter-spacing:2px;

      transition:.3s;
    }

    button:hover{
      opacity:.85;
    }

    input[type=range]{
      width:260px;

      accent-color:#ff8de1;
    }

    /* MOBILE */

    @media (max-width:768px){

      .logo{
        width:220px;
      }

      .lamb-container{
        width:320px;
        height:420px;
      }

      .lamb{
        width:140px;
      }

      .ig{
        left:0;
        top:20px;
      }

      .shop{
        left:90px;
        top:140px;
      }

      .yt{
        left:170px;
        top:40px;
      }

      input[type=range]{
        width:180px;
      }

    }

  </style>

</head>

<body>

  <!-- BACKGROUND -->

  <img src="bg.jpg" class="background">

  <!-- LOGO -->

  <img src="logo.png" class="logo">

  <!-- LAMBS -->

  <div class="lamb-container">

    <!-- INSTAGRAM -->

    <a href="https://instagram.com/aerosol_____" target="_blank">

      <img
        src="lamb1.png"
        class="lamb ig"
      >

    </a>

    <!-- SHOP -->

    <a href="https://aerosolskateboards.com" target="_blank">

      <img
        src="lamb2.png"
        class="lamb shop"
      >

    </a>

    <!-- YOUTUBE -->

    <a
      href="https://www.youtube.com/@a.e.r.o.s.o.l"
      target="_blank"
    >

      <img
        src="lamb3.png"
        class="lamb yt"
      >

    </a>

  </div>

  <!-- AUDIO PLAYER -->

  <div class="player">

    <button id="playBtn">
      PLAY
    </button>

    <input
      type="range"
      id="progress"
      value="0"
      min="0"
      max="100"
    >

  </div>

  <!-- AUDIO -->

  <audio id="audio">

    <source
      src="song.mp3"
      type="audio/mpeg"
    >

  </audio>

  <!-- SCRIPT -->

  <script>

    const audio =
      document.getElementById("audio");

    const playBtn =
      document.getElementById("playBtn");

    const progress =
      document.getElementById("progress");

    /* PLAY / PAUSE */

    playBtn.addEventListener("click",()=>{

      if(audio.paused){

        audio.play();

        playBtn.innerText="PAUSE";

      }else{

        audio.pause();

        playBtn.innerText="PLAY";

      }

    });

    /* UPDATE PROGRESS */

    audio.addEventListener("timeupdate",()=>{

      const percent =
        (audio.currentTime / audio.duration) * 100;

      progress.value = percent;

    });

    /* SCRUB AUDIO */

    progress.addEventListener("input",()=>{

      audio.currentTime =
        (progress.value / 100) * audio.duration;

    });

  </script>

</body>
</html>
